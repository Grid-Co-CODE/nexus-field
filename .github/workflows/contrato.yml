# Contrato diário com o site (spec 2026-10-16, seção 10.2). Um GET de leitura no /api/app: se sumir do campo.html algo de
# que a casca depende, ou aparecer o que ela não cobre (chave gc_ nova, outro banco IndexedDB), abre uma issue antes de
# o campo sentir. O que é conferido está no testes/contrato.mjs; a issue, no ferramentas/issue-do-contrato.mjs. O site
# não é alterado.
name: contrato

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

# issues: write para a issue; actions: write só para o PUT .../enable do passo "Manter o agendamento ligado".
permissions:
  contents: read
  issues: write
  actions: write

jobs:
  contrato:
    name: Contrato com o site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # O contrato e a issue só leem o inicio.js (CommonJS, sem dependências) e usam o fetch e o gh: não precisa de npm ci.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      # O código de saída vai para a saída do passo (e não derruba o passo) para a issue poder ser tratada antes de o job
      # cair: 0 ok, 1 o site mudou, 2 não deu para ler o site, 3 o próprio contrato falhou.
      - name: Conferir o contrato
        id: conferir
        run: |
          set +e
          node testes/contrato.mjs 2>&1 | tee "$RUNNER_TEMP/contrato.txt"
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Uma issue por TIPO de falha (o site mudou, não deu para ler o site, o próprio teste quebrou), cada uma com rótulo e
      # título próprios: um site fora do ar não esconde a quebra de verdade do dia seguinte. Roda também com o contrato ok,
      # para fechar as de leitura e de erro e avisar na de quebra que voltou a passar. O corpo é a saída do contrato, que
      # diz o NOME do que mudou e nunca copia trecho do campo.html.
      - name: A issue do contrato
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODIGO: ${{ steps.conferir.outputs.codigo }}
        run: node ferramentas/issue-do-contrato.mjs "$RUNNER_TEMP/contrato.txt"

      # O GitHub desliga o agendamento de repositório PÚBLICO sem atividade por 60 dias, e esta casca passa meses sem commit
      # (a parte web chega pelo servidor): sem isto, o contrato morreria calado, e a falta de issue pareceria "tudo certo".
      # Ligar o workflow de novo pela API a cada execução o mantém vivo. Não é documentado pelo GitHub; é o observado em
      # 2026 (um repositório público seguiu rodando mais de 120 dias depois do último commit assim). Commit automático
      # para "fazer atividade" não: o projeto mais usado que fazia isso foi desativado pelo GitHub por violar os termos.
      - name: Manter o agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method PUT "repos/${GH_REPO}/actions/workflows/contrato.yml/enable"

      - name: Derrubar o job se o contrato falhou
        if: always() && steps.conferir.outputs.codigo != '0'
        run: exit 1
