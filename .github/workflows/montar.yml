# Montagem da casca. Em todo push e PR: os testes de Node, os de JVM, o APK de depuração e o lint. Em tag v*: a Release
# assinada, com o APK, o SHA-256 e o versao.json que o app lê para se atualizar (spec 2026-10-16, seções 7 e 8).
#
# O versionCode da Release é o GITHUB_RUN_NUMBER deste workflow, que o GitHub conta por arquivo de workflow: NÃO renomeie
# nem apague este arquivo, senão a contagem recomeça em 1 e o Android recusa a atualização (versionCode menor). O job
# release confere isso contra a última Release antes de assinar.
name: montar

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# O padrão é só leitura. A única permissão de escrita (contents: write) é a do job release, mais abaixo.
permissions:
  contents: read

jobs:
  montar:
    name: Testes e APK de depuração
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 (o histórico inteiro): o testes/dados-pessoais.test.mjs monta a lista de nomes do `git log`. No
      # checkout raso de um pull_request o log tem só o commit de merge de teste do GitHub (autor "GitHub", que não é
      # gente), e a varredura de nomes não procurava ninguém. Mesmo com o histórico, o teste falha no CI se a lista vier
      # sem nenhum autor que seja gente, em vez de pular.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # O jsdom 30 (testes do script de início) pede Node ^22.22.2; o 22.x pega o mais recente da série.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Testes de Node
        run: |
          npm ci
          npm test

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # cache-provider basic: o cache de código aberto (o 'enhanced', padrão, é um serviço comercial). O cache só é gravado
      # a partir da main; PRs e tags só leem.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # O Robolectric baixa o Android de cada SDK dos testes de JVM (o 36 e o 7, uns 290 MB) no repositório Maven local, que
      # o cache do Gradle não guarda: sem este, todo push baixava tudo de novo. A chave é o build.gradle (onde mora a versão
      # do Robolectric), e a anterior serve de partida. Só neste job: o release não usa cache nenhum.
      - name: O Android do Robolectric
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/app/build.gradle') }}
          restore-keys: robolectric-

      - name: Testes de JVM, APK de depuração e lint
        run: |
          npx cap sync android
          cd android
          ./gradlew testDebugUnitTest assembleDebug lint

      # No Windows do desenvolvedor estes dois testes são PULADOS (o FileProvider compara caminhos com "/"), e o Gradle conta
      # teste pulado como sucesso. Só o Linux daqui os prova: se um deles aparecer como pulado, falho ou sumido, o CI cai.
      - name: Os dois testes do FileProvider rodaram de verdade
        run: >
          node ferramentas/testes-pulados.mjs
          android/app/build/test-results/testDebugUnitTest
          br.com.gridco.campo.AtualizadorTest
          instaladorRecebeOUriDoProviderParaOApkDaPasta
          oProviderDoInstaladorNaoExpoeNadaAlemDeCacheAtualizacao

      - name: APK de depuração
        uses: actions/upload-artifact@v7
        with:
          name: nexus-field-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Relatórios do Gradle (só se algo falhou)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-gradle
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore

  # A Release vai para os ~50 aparelhos e não tem volta (o versionCode não desce; a chave não muda). O GitHub roda o
  # montar.yml do COMMIT da tag: uma tag posta num ramo com este arquivo mexido leva junto as conferências daqui. A guarda
  # de verdade é a configuração do repositório (CLAUDE.md, "O que a Task 10 configura no GitHub"): o ambiente release só
  # para tags v*, com revisor obrigatório, e as tags v* que só os administradores criam. As conferências abaixo pegam o
  # engano (a tag num ramo em andamento, a contagem que recomeçou, a chave trocada) antes de a chave sair do secret.
  release:
    name: Release assinada
    needs: montar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # O ambiente 'release' é onde moram os secrets da chave de assinatura (Settings > Environments).
    environment: release
    permissions:
      contents: write
    steps:
      # O app só enxerga o Grid-Co-CODE/nexus-field: o Atualizador lê o versao.json de releases/latest/download/ dele, e o
      # VersaoRemota só aceita o APK das Releases dele (o testes/versao-json.test.mjs confere o nome nos três lados e este
      # passo). Uma Release assinada que saísse de outro repositório (um fork, o nome antigo, o repositório criado com outro
      # nome ou outra caixa) seria publicada e vista por ninguém: os aparelhos ficariam sem atualização, em silêncio. É o
      # primeiro passo: falha antes de baixar o código e muito antes de a chave sair do secret. O GITHUB_REPOSITORY o
      # próprio runner define.
      - name: O repositório é o que o app enxerga
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY:-}" != "Grid-Co-CODE/nexus-field" ]; then
            echo "Esta Release sairia de '${GITHUB_REPOSITORY:-}', mas o app só enxerga Grid-Co-CODE/nexus-field: nada foi publicado." >&2
            exit 1
          fi

      # Neste job, toda action é fixada por SHA de commit, com a tag no comentário: uma tag móvel sequestrada rodaria aqui
      # com o token de escrita e perto das senhas da chave. SHAs conferidos com `gh api repos/<action>/commits/<tag>` em
      # 17/10/2026; cada versão tinha ao menos duas semanas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O histórico inteiro, para conferir que o commit da tag está na main.
          fetch-depth: 0

      # Só sai Release do que passou pela main: uma tag posta por engano num ramo de worktree publicaria código que nunca
      # foi revisado, e o versionCode não volta atrás.
      - name: O commit da tag está na main
        run: |
          set -euo pipefail
          alvo="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [ "$alvo" != "$(git rev-parse HEAD)" ]; then
            echo "O checkout não é o commit da tag ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$alvo" origin/main; then
            echo "A tag ${GITHUB_REF_NAME} aponta para um commit que não está na main: a Release só sai do que passou pela main." >&2
            exit 1
          fi

      # As notificações (resumos e emergência) chegam pelo Firebase, e o APK só o tem com o android/app/google-services.json
      # (o projeto do Firebase; não é segredo). Sem ele o build passa e o APK sai sem Firebase: é o esperado no job dos
      # testes e no PR, mas na Release seria um APK que nunca recebe aviso indo aos aparelhos, sem erro em lugar nenhum.
      - name: O Firebase do app está no repositório
        run: |
          set -euo pipefail
          if [ ! -s android/app/google-services.json ]; then
            echo "Falta o android/app/google-services.json (o projeto do Firebase), ou ele está vazio: o APK sairia sem as notificações. Nada foi publicado." >&2
            exit 1
          fi

      # Sem o cache do npm: o APK que vai ao campo sai de dependências baixadas agora.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      # VERSAO_CASCA é a tag sem o v. A tag é conferida ANTES de virar variável e nome de arquivo, pela MESMA regra do
      # versionName (o semver mora só no ferramentas/versao-json.mjs, que só usa o Node: não precisa do npm ci). O tipo
      # (final ou pre-lancamento) decide se a Release sai como pré-lançamento.
      - name: Versão da tag
        run: |
          set -euo pipefail
          versao="${GITHUB_REF_NAME#v}"
          tipo="$(node ferramentas/versao-json.mjs tipo-da-versao "$versao")"
          if [ ! -f "novidades/${versao}.md" ]; then
            echo "Falta o arquivo novidades/${versao}.md (as novidades desta versão)." >&2
            exit 1
          fi
          echo "VERSAO_CASCA=${versao}" >> "$GITHUB_ENV"
          echo "TIPO_DA_VERSAO=${tipo}" >> "$GITHUB_ENV"

      # O app ignora em silêncio um versionCode que não cresce. Conferido contra o versao.json da última Release, antes de a
      # chave sair do secret. O 404 só vale quando ainda não há Release nenhuma.
      - name: O versionCode cresce
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          anterior="$RUNNER_TEMP/versao-anterior.json"
          codigo="$(curl -sSL --retry 3 -o "$anterior" -w '%{http_code}' "${GITHUB_SERVER_URL}/${GH_REPO}/releases/latest/download/versao.json")"
          case "$codigo" in
            200)
              node ferramentas/versao-json.mjs conferir-crescimento "$anterior"
              ;;
            404)
              publicadas="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq length)"
              if [ "$publicadas" != "0" ]; then
                echo "Há Release publicada, mas a última não tem versao.json: não dá para conferir o versionCode." >&2
                exit 1
              fi
              echo "Nenhuma Release publicada ainda: esta é a primeira."
              ;;
            *)
              echo "Não consegui ler o versao.json da última Release (HTTP ${codigo})." >&2
              exit 1
              ;;
          esac

      - name: Dependências do npm
        run: npm ci

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Sem cache: o APK que vai ao campo sai de dependências baixadas agora, não de um cache de outro build.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # A parte web vai ao projeto Android ANTES de a chave sair do secret: o CLI do Capacitor e as dependências npm dele
      # rodam sem as senhas no ambiente e sem a chave no disco.
      - name: Copiar a parte web para o Android
        run: npx cap sync android

      # A chave vem em base64 num secret e é gravada na pasta temporária do runner, só com permissão do dono. Nada aqui
      # imprime o secret: o printf é embutido no shell (não aparece nos argumentos de nenhum processo) e vai direto ao base64.
      - name: Decodificar a chave de assinatura
        env:
          CASCA_KEYSTORE_B64: ${{ secrets.CASCA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          : "${CASCA_KEYSTORE_B64:?o secret CASCA_KEYSTORE_B64 está vazio ou não existe no ambiente release}"
          umask 077
          printf '%s' "$CASCA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/casca.jks"
          test -s "$RUNNER_TEMP/casca.jks"

      # As quatro CASCA_* só existem neste passo (e não no GITHUB_ENV, que as passaria a todos os passos seguintes). O alias
      # vem de vars (não é segredo, e como secret o GitHub mascarava "campo" em todo log do job). Se alguma estiver vazia, o
      # android/app/build.gradle derruba o build dizendo o NOME das que faltam. O Gradle e o que ele carrega (o AGP, o
      # capacitor-android) ainda rodam com as senhas: é o que a assinatura do AGP pede. A chave sai do disco assim que o
      # Gradle termina (trap); o último passo do job a apaga de novo, se algo cair antes.
      - name: APK assinado
        env:
          CASCA_KEYSTORE: ${{ runner.temp }}/casca.jks
          CASCA_KEYSTORE_SENHA: ${{ secrets.CASCA_KEYSTORE_SENHA }}
          CASCA_CHAVE_ALIAS: ${{ vars.CASCA_CHAVE_ALIAS }}
          CASCA_CHAVE_SENHA: ${{ secrets.CASCA_CHAVE_SENHA }}
        run: |
          set -euo pipefail
          trap 'rm -f "$CASCA_KEYSTORE"' EXIT
          cd android
          ./gradlew assembleRelease

      # Sem assinatura o AGP escreve app-release-unsigned.apk, e o app-release.apk nem existe. O apksigner (o build-tools do
      # próprio runner) confere a assinatura e imprime o certificado; o ferramentas/certificado.mjs exige que ele seja o da
      # variável CASCA_CERT_SHA256 do repositório (o pino). Os aparelhos confiam para sempre na chave da primeira versão:
      # um APK com outra chave seria oferecido a cada 6 h e recusado pelo instalador, e o "desinstale" apagaria o espelho.
      - name: Conferir a assinatura e o certificado
        env:
          CERT_ESPERADO: ${{ vars.CASCA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "Não saiu o APK assinado (app-release.apk): confira se as quatro variáveis CASCA_* chegaram ao build." >&2
            exit 1
          fi
          cp "$apk" nexus-field.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$apksigner" verify --print-certs nexus-field.apk > "$RUNNER_TEMP/certificados.txt"
          node ferramentas/certificado.mjs "$RUNNER_TEMP/certificados.txt"

      # O SHA-256 vai em dois lugares (o arquivo .sha256 e o versao.json) calculados por programas diferentes
      # (sha256sum e o node): se divergirem, algo está errado e nada é publicado.
      - name: SHA-256 e versao.json
        run: |
          set -euo pipefail
          sha256sum nexus-field.apk > nexus-field.apk.sha256
          node ferramentas/versao-json.mjs --apk nexus-field.apk --novidades "novidades/${VERSAO_CASCA}.md" --saida versao.json
          test "$(cut -d' ' -f1 nexus-field.apk.sha256)" = "$(node -p "require('./versao.json').sha256")"

      # Versão com pré-versão (1.1.0-rc.1) sai como pré-lançamento: a releases/latest/ que o app lê não a enxerga. O tipo
      # veio do passo "Versão da tag" (o hífen do metadado de build, como em 1.0.0+ci-7, não conta).
      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          extras=()
          case "$TIPO_DA_VERSAO" in
            pre-lancamento) extras+=(--prerelease) ;;
            final) ;;
            *)
              echo "Tipo de versão desconhecido (${TIPO_DA_VERSAO}): nada publicado." >&2
              exit 1
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" nexus-field.apk nexus-field.apk.sha256 versao.json \
            --verify-tag \
            --title "Nexus Field ${VERSAO_CASCA}" \
            --notes-file "novidades/${VERSAO_CASCA}.md" \
            "${extras[@]}"

      - name: Apagar a chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/casca.jks"
