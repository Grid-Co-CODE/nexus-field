apply plugin: 'com.android.application'

// Versão e assinatura vêm do ambiente: o CI preenche, e na máquina do desenvolvedor valem os padrões.
// versionCode = número da execução do GitHub Actions (sempre cresce, o Android exige); versionName = semver da casca.
def casca_versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def casca_versionName = System.getenv('VERSAO_CASCA') ?: '0.0.0-dev'
// A assinatura vem de quatro variáveis, todas ou nenhuma. Nenhuma: o release sai SEM assinar (o build de depuração, os
// testes e o CI de PR não precisam de chave). Só algumas: o build FALHA, dizendo quais faltam, porque o caso real é um secret
// do Actions vazio ou com o nome trocado, e o release sairia sem assinar sem ninguém ver (o técnico só descobriria quando
// o Android recusasse a atualização). Variável vazia vale como ausente. Só os NOMES são impressos, nunca os valores.
def casca_vars_assinatura = ['CASCA_KEYSTORE', 'CASCA_KEYSTORE_SENHA', 'CASCA_CHAVE_ALIAS', 'CASCA_CHAVE_SENHA']
def casca_vars_faltando = casca_vars_assinatura.findAll { !System.getenv(it) }
if (casca_vars_faltando && casca_vars_faltando.size() < casca_vars_assinatura.size()) {
    throw new GradleException('Assinatura incompleta: faltam as variáveis ' + casca_vars_faltando.join(', ') +
            '. Defina as quatro (CASCA_KEYSTORE, CASCA_KEYSTORE_SENHA, CASCA_CHAVE_ALIAS, CASCA_CHAVE_SENHA) ou nenhuma.')
}
def casca_assinatura = casca_vars_faltando.isEmpty()
def casca_keystore = System.getenv('CASCA_KEYSTORE')

android {
    // O pacote Java fica br.com.gridco.campo; o applicationId é o do Nexus Field (17/10/2026), mudado antes da primeira
    // Release: depois dela, outro applicationId é outro aplicativo para o Android, e cada técnico teria de desinstalar
    // (o que apaga o espelho). O que depende dele o lê daqui: ${applicationId} no manifesto, BuildConfig.APPLICATION_ID.
    namespace = "br.com.gridco.campo"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.gridco.nexusfield"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode casca_versionCode
        versionName casca_versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        // O AGP 8 não gera mais o BuildConfig sozinho; a casca lê dele a versionName (o fim do user agent,
        // NexusField/<versão>), o DEBUG (o registro das navegações só na versão de teste) e o APPLICATION_ID (a
        // autoridade do provider do instalador).
        buildConfig = true
    }
    signingConfigs {
        release {
            if (casca_assinatura) {
                storeFile file(casca_keystore)
                storePassword System.getenv('CASCA_KEYSTORE_SENHA')
                keyAlias System.getenv('CASCA_CHAVE_ALIAS')
                keyPassword System.getenv('CASCA_CHAVE_SENHA')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (casca_assinatura) {
                signingConfig signingConfigs.release
            }
        }
    }
    testOptions {
        unitTests {
            // O Robolectric precisa dos recursos e do manifesto do app para montar a Activity nos testes.
            includeAndroidResources = true
            all {
                // O Robolectric do Android 16 (SDK 36) cria a memória compartilhada do app por dentro do JDK
                // (jdk.internal.access.SharedSecrets). O JDK 21 fecha esse pacote, e sem a abertura todo teste do
                // Robolectric morre em beforeTest com "Failed to interact with raw FileDescriptor internals".
                // Visto em 17/10/2026 na primeira rodada, com JDK 21.
                jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
                // O Robolectric guarda o jar do Android em ~/.m2. Com espaço no nome do usuário do Windows ele monta o
                // caminho com "%20" e não acha o arquivo que acabou de baixar ("Unable to load Robolectric native
                // runtime library"). O ferramentas/ambiente.sh aponta CASCA_M2_LOCAL para uma pasta sem espaço.
                def m2Local = System.getenv('CASCA_M2_LOCAL')
                if (m2Local) {
                    systemProperty 'maven.repo.local', m2Local
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.browser:browser:1.10.0"
    // O script de início, o canal por regra de origem e o ScriptHandler. O capacitor-android já usa a mesma versão,
    // mas como `implementation`, e não a repassa ao app.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // As notificações (spec 2026-10-18): o Firebase Cloud Messaging, que é grátis e é o que o Android entrega com o app
    // fechado. Só o Messaging (nada de Analytics). O BOM escolhe as versões que funcionam juntas, e o número fixo faz o
    // APK de hoje e o de daqui a um mês saírem das mesmas bibliotecas. O 34.19.0 é de 09/09/2026: o 35 tinha 11 dias
    // quando a dependência entrou (18/10/2026), e uma versão maior nova não vai aos ~50 aparelhos antes de assentar.
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    implementation "com.google.firebase:firebase-messaging"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.17"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// O google-services.json identifica o projeto do Firebase; não é segredo (a chave de serviço mora só no servidor) e entra
// no repositório quando o dono da casca criar o projeto. Sem ele o plugin não é aplicado, e o build de depuração e o do
// CI de PR saem sem Firebase: o app roda e não recebe aviso. O job release do montar.yml FALHA sem o arquivo, para
// nenhuma Release ir ao campo sem as notificações. O arquivo que existe vazio ou torto aplica o plugin e derruba o build
// (melhor que o try/catch do template, que soltava um APK sem Firebase em silêncio).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info('Sem o android/app/google-services.json: o APK sai sem o Firebase (sem notificações).')
}
